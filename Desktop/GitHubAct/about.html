<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>About Us | Our Simple Website</title>
        <style>
            :root {
                --primary-color: #4f46e5;
                --primary-hover: #4338ca;
                --bg-color: #f8fafc;
                --card-bg: #ffffff;
                --text-main: #1e293b;
                --text-muted: #64748b;
                --border-color: #e2e8f0;
            }

            body {
                font-family: Arial, sans-serif;
                background-color: #f4f4f4;
                color: #333;
                margin: 0;
                padding; 0;
                line-height: 1.6;
                display: flex;
                flex-direction: column;
                align-items: center;
             
            }

            nav {
                background-color: #333;
                padding: 15px 30px;
                display: flex;
                justify-content: space-between;
                align-items: center;
                width: 100%;
                max-width: 800px;
                box-sizing: border-box;
                border-radius: 8px 8px 0 0;
            }

            nav h2 {
                color: white;
                margin: 0;
                font-size: 1.2rem;
            }

            .nav-links a {
                color: white;
                text-decoration: none;
                margin-left: 25px;
                font-weight: 500;
            }

            .nav-links a:hover {
                color: #a5b4fc; 
            }

            header {
                text-align: center;
                background: #e2e8f0;
                width: 100%;
                max-width: 800px;
                padding: 30px;
                box-sizing: border-box;

            }

            header h1 {
                margin: 20px 0 8px 0;
                color: var(--text-main);
                font-size: 2rem;
            }

            header p {
                margin: 0;
                color: var(--text-muted);
                font-size: 1.05rem;
            }

            main {
                background: var(--card-bg);
                width: 100%;
                max-width: 800px;
                padding: 30px;
                box-sizing: border-box;
                border-radius: 0 0 8px 8px;
                border: 1px solid var(--border-color);
                border-top: none;
            }

            h2 {
                color: var(--primary-color);
                font-size: 1.25rem;
                margin-top: 20px;
                margin-bottom: 12px;
            }

            p, ul {
                color: var(--text-muted);
                margin-top: 0;
            }

            ul {
                padding-left: 20px;
            }

            li {
                margin-bottom: 6px;
            }
        </style>
    </head>
    <body>

        <nav>
            <h2>Homepage</h2>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="about.html">About Us</a>
                <a href="contact.html">Contact Us</a>
            </div>
        </nav>

        <header>
            <h1>About Page</h1>
            <p>Welcome to our website!</p>
        </header>

        <main>
            <h2>Who We Are</h2>
            <p>We are a group of students working together on our simple website project.</p>
            
            <h2>Our Group Members</h2>
            <ul>
                <li>Jayce Tabamo</li>
                <li>Emmanuel Capulong</li>
                <li>Francis Bermundo</li>
                <li>Lyod Gutierrez</li>
            </ul>
        </main>

    </body>
</html>
